[project]
name = "sapis"
version = "0.1.0"
description = "Automated test generation and execution for SAP Integration Suite iFlows"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# The pipeline code lives in src/. Without this, pytest inserts the rootdir into
# sys.path before PYTHONPATH and `pipeline` stops being importable.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
